[package]
name = "nanopore-dtw-cli"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Nanopore sequencing raw signal processing with DTW alignment"
license = "MIT"
repository = "https://github.com/biotools/nanopore-dtw-cli"
readme = "README.md"
keywords = ["bioinformatics", "nanopore", "dtw", "sequencing", "hdf5"]
categories = ["science", "command-line-utilities"]

[lib]
name = "nanopore_dtw"
path = "src/lib.rs"

[[bin]]
name = "nanopore-dtw"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "wrap_help"] }
hdf5 = { version = "0.8", optional = true }
hdf5-sys = { version = "0.8", optional = true }
rayon = "1.10"
ndarray = { version = "0.15", features = ["rayon", "approx"] }
ndarray-stats = "0.5"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"
num-traits = "0.2"
num-complex = "0.4"
float-cmp = "0.9"
approx = "0.5"
log = "0.4"
env_logger = "0.11"
atty = "0.2"
walkdir = "2.5"
bitflags = "1.3"
rand = "0.8"
rand_distr = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.10"



[[bench]]
name = "dtw_bench"
harness = false

[features]
default = ["simd", "mock-data"]
hdf5 = ["dep:hdf5", "dep:hdf5-sys"]
simd = []
avx2 = ["simd"]
neon = ["simd"]
debug-print = []
mock-data = []

[package.metadata.docs.rs]
features = ["simd"]
rustc-args = ["--cfg", "docsrs"]

[package.metadata.deb]
maintainer = "Bioinformatics Team <team@biotools.dev>"
copyright = "2025, Bioinformatics Team"
license-file = ["LICENSE", "0"]
depends = "$auto"
section = "science"
priority = "optional"
extended-description = """
Nanopore DTW CLI is a high-performance command-line tool for processing
Oxford Nanopore Technologies sequencing data. It reads raw electrical
signals from FAST5/POD5 files, performs dynamic time warping alignment
against reference sequences, and outputs results in SAM/BAM format.
"""


